name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles app,dmg"
          - platform: ubuntu-22.04
            rust_target: ""
            args: "--bundles deb,appimage"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-desktop-build
        with:
          save-cache: "false"
          rust-target: ${{ matrix.rust_target }}

      - name: Check Tauri JS/Rust versions
        run: npm run check:tauri-versions

      - name: Load release notes from CHANGELOG
        id: notes
        run: node scripts/release-notes.mjs --github-output >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.notes.outputs.tag }}
          releaseName: ${{ steps.notes.outputs.name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
