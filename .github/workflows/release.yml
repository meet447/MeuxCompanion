name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            g++ \
            cmake \
            pkg-config \
            libssl-dev \
            libclang-dev \
            clang \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libgdk-pixbuf-2.0-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libsoup-3.0-dev

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Rust linker search path for libstdc++ (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          gcc_dir=$(dirname "$(gcc -print-file-name=libstdc++.so)")
          echo "RUSTFLAGS=-C link-arg=-L${gcc_dir}" >> "$GITHUB_ENV"
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "CXX=g++" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Meuxe v__VERSION__"
          releaseBody: |
            macOS and Linux prerelease builds.

            macOS builds are unsigned; Gatekeeper may block the app until you allow it in System Settings.

            Chat requires an ACP agent (Claude Code, Codex, or OpenCode) installed separately.

            TTS defaults to the system voice provider.

            Whisper speech-to-text downloads its model (~75MB) on first microphone use.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
